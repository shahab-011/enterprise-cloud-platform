services:
  platform:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Enterprise Cloud Platform Modernization Demo
      DATABASE_PATH: /data/platform.sqlite3
      DATABASE_TIMEOUT_SECONDS: "5"
      RATE_LIMIT_REQUESTS: "60"
      RATE_LIMIT_WINDOW_SECONDS: "60"
    volumes:
      - platform-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  platform-data:
